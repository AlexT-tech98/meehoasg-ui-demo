name: Visual evidence
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'baseline/**'
      - 'assets/**'
      - 'demo-api.js'
      - 'scripts/capture.mjs'
      - '.github/workflows/visual-evidence.yml'
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: node scripts/capture.mjs
      - run: bash scripts/measure.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: meehoa-before-after
          path: evidence/
          retention-days: 30
