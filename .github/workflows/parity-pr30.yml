name: PR30 parity browser smoke
on:
  push:
    branches: [main]
    paths:
      - 'parity-pr30/**'
      - 'scripts/check-parity-pr30.mjs'
      - '.github/workflows/parity-pr30.yml'
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: node scripts/check-parity-pr30.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr30-parity-evidence
          path: evidence/parity-pr30/
          retention-days: 14
