<div class="shell"><aside class="side"><div class="logo">meehoa<i>.</i></div><div class="tagline">ATELIER OPERATIONS</div><nav class="nav" id="nav"></nav><div class="side-bottom"><span class="avatar">M</span><span>Quản lý tiệm<br><b style="color:white">Meehoasg Studio</b></span></div></aside><main class="main"><header class="top"><div class="crumb">Meehoasg Workspace / <b id="crumb">Tổng quan</b></div><div class="mobile-head">meehoa<span style="color:#ef6d54">.</span></div><div class="topright"><span class="pill datebtn">◷ Thứ Bảy, 10/10/2026</span><button class="create" id="topCreate">+ Tạo đơn</button></div></header><div class="body" id="content"></div></main></div><nav class="mobile-tabs" id="mobileTabs"></nav>
<div class="overlay hidden" id="overlay"><div class="dialog"><div class="dialoghead"><h2 id="modalTitle">Tạo đơn mới</h2><button class="x" id="closeModal">✕</button></div><div class="formgrid"><label class="formlabel">Tên khách hàng<input class="field" placeholder="Nhập tên khách"></label><label class="formlabel">Số điện thoại<input class="field" placeholder="09xx xxx xxx"></label><label class="formlabel">Ngày nhận hoa<input type="date" class="field" value="2026-10-10"></label><label class="formlabel">Giờ nhận hoa<input type="time" class="field" value="14:00"></label><label class="formlabel">Giá trị đơn<input class="field" placeholder="500.000"></label><label class="formlabel">Sale phụ trách<select class="field"><option>Chọn nhân viên</option><option>Huỳnh Xuyến</option><option>C Mụi</option><option>Pu</option></select></label><label class="formlabel wide">Mẫu hoa & ghi chú<textarea class="field" placeholder="Nhập mẫu hoa, tone màu, ghi chú..."></textarea></label></div><div class="actions"><button class="softbtn" id="cancelModal">Hủy</button><button class="create" id="fakeSave">Lưu đơn demo</button></div><p class="sub" style="margin-top:13px">Đây là bản concept, không ghi dữ liệu thật.</p></div></div>
<script>
const pages=[['dashboard','◫','Tổng quan'],['orders','▤','Đơn hàng'],['production','◈','Sản xuất'],['delivery','↗','Giao hàng'],['debt','◉','Công nợ'],['sales','▥','Nhân viên'],['materials','✳','Nguyên liệu']];
const staff=[['Huỳnh Xuyến',5100000],['C Mụi',3700000],['Pu',2800000],['Chưa phân công',1250000]];
const orders=[['MH-1042','14:00','Ngọc Anh','Bó hồng pastel',650000,'Chờ bó','Huỳnh Xuyến'],['MH-1043','14:30','Minh Thư','Ly kép & hồng',850000,'Đã bó','C Mụi'],['MH-1044','15:00','Đức Huy','Bó tulip hồng',1200000,'Đang giao','Pu'],['MH-1045','15:30','Thanh Hà','Kệ hoa khai trương',1850000,'Chờ bó','Huỳnh Xuyến'],['MH-1046','16:00','Thu Trang','Hoa tone kem',550000,'Đã giao','C Mụi'],['MH-1047','17:00','Phương Uyên','Bó hoa burgundy',750000,'Đã bó','Pu']];
let current='dashboard',period='today',search='',status='all';
const fmt=n=>new Intl.NumberFormat('vi-VN').format(n)+'đ';
const badge=s=>'<span class="status '+(s==='Đã giao'?'done':s==='Đang giao'?'ship':s==='Đã bó'?'wait':'')+'">'+s+'</span>';
const head=(eye,title,desc,right='')=>'<div class="hrow"><div><div class="eyebrow">'+eye+'</div><h1>'+title+'</h1><div class="sub">'+desc+'</div></div>'+right+'</div>';
function dashboard(){const vals=period==='today'?[12850000,28,459000,3250000,21,28]:period==='week'?[78600000,169,465000,8200000,152,169]:[325400000,708,460000,14800000,684,708];let hours=period==='today'?[1,2,4,3,7,4,2]:[7,13,21,19,41,22,12];let labels=['08–10','10–12','12–14','14–16','16–18','18–20','20–22'];let max=Math.max(...hours);return head('BUSINESS SNAPSHOT','Một ngày ở Meehoasg.','Tình hình kinh doanh và công việc cần ưu tiên trong một màn hình.','<div class="chips">'+[['today','Hôm nay'],['week','7 ngày'],['month','30 ngày']].map(([p,n])=>'<button data-period="'+p+'" class="'+(period===p?'on':'')+'">'+n+'</button>').join('')+'</div>')+
'<div class="stats">'+[['Doanh thu đơn hàng',fmt(vals[0]),'Tổng giá trị đơn trong kỳ'],['Tổng số đơn',vals[1],'Đơn theo ngày nhận hoa'],['Trung bình / đơn',fmt(vals[2]),'Giá trị đơn bình quân'],['Công nợ còn thu',fmt(vals[3]),'Cần thu và đối soát'],['Hoàn tất giao hàng',vals[4]+'/'+vals[5],Math.round(vals[4]/vals[5]*100)+'% số đơn đã giao']].map((x,i)=>'<div class="stat '+(i===0?'feature':'')+'"><span class="k">'+x[0]+'</span><div class="val">'+x[1]+'</div><div class="meta">'+x[2]+'</div></div>').join('')+'</div>'+
'<div class="split"><section class="panel"><div class="panelheader"><div><h2>Đơn hàng theo khung giờ</h2><div class="hint">Theo giờ khách nhận hoa · Chỉ hiện khung có đơn</div></div><span class="pill">● Cao điểm 16–18h</span></div><div class="bars">'+hours.map((v,i)=>'<div class="baritem"><b>'+v+'</b><div class="barfill '+(v===max?'peak':'')+'" style="height:'+Math.round(115*v/max)+'px"></div><small>'+labels[i]+'</small></div>').join('')+'</div></section>'+
'<section class="panel"><div class="panelheader"><div><h2>Doanh thu theo nhân viên</h2><div class="hint">Tổng giá trị đơn theo Sale phụ trách</div></div><span class="pill">4 nhóm</span></div><div class="people">'+staff.map((x,i)=>'<div class="person"><span>'+x[0]+'</span><div class="track"><div class="fill" style="width:'+x[1]/51000+'%"></div></div><b>'+(x[1]/1e6).toFixed(2)+'tr</b></div>').join('')+'</div></section></div>'+
'<section class="panel table-panel"><div class="table-header"><div><h2>Đơn cần chú ý</h2><div class="hint">Những đơn sắp đến giờ nhận và chưa hoàn tất</div></div><button class="softbtn" data-go="orders">Xem tất cả →</button></div>'+table(orders.slice(0,4))+'</section>'}
function table(data){return '<div class="table-wrap"><table><thead><tr><th>Mã đơn</th><th>Giờ nhận</th><th>Khách hàng</th><th>Mẫu hoa</th><th>Giá trị</th><th>Trạng thái</th><th>Sale</th></tr></thead><tbody>'+data.map(o=>'<tr><td class="name">'+o[0]+'</td><td>'+o[1]+'</td><td class="name">'+o[2]+'</td><td>'+o[3]+'</td><td>'+fmt(o[4])+'</td><td>'+badge(o[5])+'</td><td class="muted">'+o[6]+'</td></tr>').join('')+'</tbody></table></div>'}
function orderPage(){let a=orders.filter(o=>(status==='all'||o[5]===status)&&o.join(' ').toLowerCase().includes(search.toLowerCase()));return head('ORDER MANAGEMENT','Quản lý đơn hàng.','Một nơi để tìm, theo dõi và xử lý mọi đơn hoa.')+'<section class="panel"><div class="table-header"><div class="toolbar"><input id="orderSearch" class="search" placeholder="⌕ Tìm khách, mã đơn, mẫu hoa..." value="'+search.replace(/"/g,'&quot;')+'"><select id="statusFilter" class="field"><option value="all">Tất cả trạng thái</option>'+['Chờ bó','Đã bó','Đang giao','Đã giao'].map(s=>'<option '+(status===s?'selected':'')+'>'+s+'</option>').join('')+'</select></div><span class="pill">'+a.length+' đơn · Demo</span></div>'+table(a)+'</section>'}
function production(){return head('FLOWER STUDIO','Bảng sản xuất.','Theo dõi hoa đang chờ bó, đã bó và sẵn sàng giao.')+'<div class="columns">'+[['Chờ bó','Chờ bó'],['Đã bó','Đã bó'],['Hoàn tất','Đã giao']].map(([label,s])=>'<div class="lane"><h3>'+label+'<span class="pill">'+orders.filter(o=>o[5]===s).length+'</span></h3>'+orders.filter(o=>o[5]===s).map(o=>'<div class="task"><b>'+o[3]+'</b><div>'+o[0]+' · '+o[1]+' · '+o[2]+'</div><button data-info="'+o[0]+'">Xem đơn →</button></div>').join('')+'</div>').join('')+'</div>'}
function delivery(){return head('FULFILLMENT','Giao hàng.','Theo dõi đơn chờ bàn giao và tình trạng vận chuyển.')+'<div class="secgrid">'+orders.filter(o=>o[5]!=='Đã giao').map((o,i)=>'<article class="ordercard"><header><b>'+o[0]+'</b>'+badge(o[5])+'</header><div class="flower">'+['💐','🌷','🌸','🪻'][i%4]+'</div><h3>'+o[2]+'</h3><p>'+o[3]+'<br>Nhận hoa: <b>'+o[1]+'</b></p><footer><b>'+fmt(o[4])+'</b><button class="softbtn" data-info="'+o[0]+'">Chi tiết</button></footer></article>').join('')+'</div>'}
function debt(){return head('PAYMENT OVERVIEW','Công nợ & thanh toán.','Theo dõi số tiền còn thu và các đơn cần đối soát.')+'<div class="stats" style="grid-template-columns:repeat(3,minmax(0,1fr));margin-bottom:15px"><div class="stat feature"><span class="k">Công nợ còn thu</span><div class="val">3.250.000đ</div><div class="meta">Tổng công nợ minh họa</div></div><div class="stat"><span class="k">Đơn chưa tất toán</span><div class="val">7</div><div class="meta">Cần kiểm tra</div></div><div class="stat"><span class="k">Đã thanh toán đủ</span><div class="val">21</div><div class="meta">Trong ngày</div></div></div><section class="panel">'+table(orders.filter(o=>o[5]!=='Đã giao'))+'</section>'}
function sales(){return head('TEAM PERFORMANCE','Hiệu suất nhân viên.','Doanh thu đơn hàng theo từng Sale, hiển thị độc lập với hoa hồng.')+'<div class="secgrid">'+staff.slice(0,3).map((x,i)=>'<div class="stat" style="min-height:180px;background:'+['#e8e6f6','#ffeadc','#dcece2'][i]+'"><span class="k">'+x[0]+'</span><div class="val">'+fmt(x[1])+'</div><div class="meta">'+[11,9,6][i]+' đơn được ghi nhận</div></div>').join('')+'</div><section class="panel table-panel"><h2>So sánh doanh thu</h2><div class="people" style="margin-top:28px">'+staff.map(x=>'<div class="person"><span>'+x[0]+'</span><div class="track"><div class="fill" style="width:'+x[1]/51000+'%"></div></div><b>'+fmt(x[1])+'</b></div>').join('')+'</div></section>'}
function materials(){let names=[['Ly kép','12 đơn','🌼'],['Hồng Ecuador','9 đơn','🌹'],['Tulip','7 đơn','🌷'],['Sofia','5 đơn','🌸'],['Plume','4 đơn','🌿'],['Hoa phụ','8 đơn','💮']];return head('MATERIAL PLANNING','Nguyên liệu hoa.','Tổng hợp các loại hoa xuất hiện trong đơn đặt.')+'<div class="secgrid">'+names.map(x=>'<article class="ordercard"><header><span class="pill">Nguyên liệu</span><span style="font-size:27px">'+x[2]+'</span></header><h3>'+x[0]+'</h3><p>Được ghi nhận trong <b>'+x[1]+'</b></p><div class="progress"><div style="width:'+Math.random()*65+30+'%"></div></div></article>').join('')+'</div><div class="notice" style="margin-top:16px">Concept minh họa theo số đơn có chứa loại hoa, không đại diện số cành hoa trong kho.</div>'}
const renderers={dashboard,orders:orderPage,production,delivery,debt,sales,materials};
function go(p){current=p;document.getElementById('crumb').textContent=pages.find(x=>x[0]===p)[2];document.getElementById('content').innerHTML=renderers[p]();document.querySelectorAll('[data-go]').forEach(x=>x.onclick=()=>go(x.dataset.go));document.querySelectorAll('[data-period]').forEach(x=>x.onclick=()=>{period=x.dataset.period;go('dashboard')});document.querySelectorAll('[data-info]').forEach(x=>x.onclick=()=>alert('Đơn '+x.dataset.info+' · Bản concept không ghi thay đổi.'));let s=document.getElementById('orderSearch');if(s)s.oninput=e=>{search=e.target.value;let pos=s.selectionStart;go('orders');let n=document.getElementById('orderSearch');n.focus();n.setSelectionRange(pos,pos)};let f=document.getElementById('statusFilter');if(f)f.onchange=e=>{status=e.target.value;go('orders')};document.querySelectorAll('.nav button,.mobile-tabs button').forEach(b=>b.classList.toggle('active',b.dataset.page===p));}
document.getElementById('nav').innerHTML=pages.map(x=>'<button data-page="'+x[0]+'"><span>'+x[1]+'</span>'+x[2]+'</button>').join('');
document.getElementById('mobileTabs').innerHTML=[pages[0],pages[1],pages[2],pages[4],pages[6]].map(x=>'<button data-page="'+x[0]+'"><b>'+x[1]+'</b>'+x[2]+'</button>').join('');
document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>go(b.dataset.page));
const overlay=document.getElementById('overlay');document.getElementById('topCreate').onclick=()=>overlay.classList.remove('hidden');for(const id of ['closeModal','cancelModal'])document.getElementById(id).onclick=()=>overlay.classList.add('hidden');overlay.onclick=e=>{if(e.target===overlay)overlay.classList.add('hidden')};document.addEventListener('keydown',e=>{if(e.key==='Escape')overlay.classList.add('hidden')});document.getElementById('fakeSave').onclick=()=>alert('Đây là demo giao diện: không lưu hoặc gửi bất kỳ dữ liệu nào.');
go('dashboard');
</script></body></html>
